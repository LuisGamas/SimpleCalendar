# Publishes SimpleCalendar to Maven Central via the Portal Publisher API.
#
# Prerequisites — set these GitHub Actions secrets:
#   MAVEN_CENTRAL_USERNAME     — Portal token username (from central.sonatype.com)
#   MAVEN_CENTRAL_PASSWORD     — Portal token password
#   SIGNING_KEY                — ASCII-armored GPG private key
#   SIGNING_KEY_ID             — Last 8 chars of the GPG key id
#   SIGNING_KEY_PASSPHRASE     — GPG key passphrase
#
# Trigger:
#   Push a tag matching v* (e.g. v2.0.0) on the default branch.

name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
